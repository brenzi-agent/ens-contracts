name: Fork CI

on:
  push:
    branches: ['ci/**']

jobs:
  simplex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec hardhat compile

      - name: Contract sizes
        run: |
          for c in simplex/SimplexController simplex/SimplexNamePolicy simplex/SimplexSponsor ethregistrar/BaseRegistrarImplementation; do
            node -e 'const a=require(process.argv[1]); console.log(process.argv[2], (a.deployedBytecode.length-2)/2)' "./artifacts/contracts/$c.sol/$(basename $c).json" "$(basename $c)"
          done

      - run: pnpm exec vitest run test/simplex
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
