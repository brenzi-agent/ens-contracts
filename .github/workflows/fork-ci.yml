name: Fork CI

on:
  push:
    branches: ['ci/**']

jobs:
  simplex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec hardhat compile

      - name: Contract sizes
        run: |
          for c in registry/ENSRegistry ethregistrar/BaseRegistrarImplementation simplex/SimplexResolver simplex/SubnameRegistrar simplex/SimplexController simplex/SimplexNamePolicy simplex/SimplexSponsor universalResolver/UniversalResolver; do
            node -e 'const a=require(process.argv[1]); console.log(process.argv[2], (a.deployedBytecode.length-2)/2)' "./artifacts/contracts/$c.sol/$(basename $c).json" "$(basename $c)"
          done
          for c in TransparentUpgradeableProxy ProxyAdmin; do
            f=$(find ./artifacts -name "$c.json" -path '*contracts-v5*' | head -1)
            node -e 'const a=require(process.argv[1]); console.log(process.argv[2], (a.deployedBytecode.length-2)/2)' "$f" "$c"
          done

      - run: pnpm exec vitest run test/simplex
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning

      - run: pnpm exec vitest run test/registry test/root
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning

      - name: Upstream registrar test, without the pushed transfer refused since recipient consent
        run: pnpm exec vitest run test/ethregistrar/TestBaseRegistrar.test.ts -t '^(?!.*should permit the owner to transfer a registration)'
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning

      - name: Upstream suites that deploy the changed registry and registrar
        run: pnpm exec vitest run test/resolvers/TestPublicResolver.test.ts test/universalResolver test/ethregistrar/TestRegistrarSecurityController.test.ts test/ethregistrar/TestExponentialPremiumPriceOracle.test.ts test/ethregistrar/TestLinearPremiumPriceOracle.test.ts
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning

  typecheck-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec hardhat compile

      - name: Type-check of namesV2.ts, TestUpgradeableStack and TestLaunchLifecycle, failing on their errors and on tsc's own, except the lifecycle's matcher calls on any-typed contracts and errors in files they import, which fail on the base too
        run: |
          echo '{"extends":"./tsconfig.json","include":["./test/simplex/fixtures/namesV2.ts","./test/simplex/TestUpgradeableStack.test.ts","./test/simplex/TestLaunchLifecycle.test.ts","./test/setup.ts","./typings-custom/**/*.ts","./artifacts/**/*.d.ts","./artifacts/node_modules/**/*.d.ts"]}' > tsconfig.tests.json
          pnpm exec tsc --noEmit -p tsconfig.tests.json > tsc.log 2>&1 || true
          cat tsc.log
          if grep -E '_tsc\.js|^error TS|^tsconfig|^test/simplex/(fixtures/namesV2|TestUpgradeableStack\.test)\.ts\(' tsc.log; then exit 1; fi
          if grep -E '^test/simplex/TestLaunchLifecycle\.test\.ts\(' tsc.log | grep -v "on type 'Assertion<any>'"; then exit 1; fi

  layout-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec hardhat compile

      - name: Regenerated layout snapshot, for an upgrade that changes a layout
        run: pnpm exec vitest run -u test/simplex/TestUpgradeableStack.test.ts -t 'storage layouts'
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning

      - uses: actions/upload-artifact@v4
        with:
          name: storageLayouts
          path: test/simplex/__snapshots__/storageLayouts.json
